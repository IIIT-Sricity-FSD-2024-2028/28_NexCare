<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Your Hospital | NexCare</title>
    <link rel="stylesheet" href="../auth/auth.css">
    <style>
        .auth-card { max-width: 720px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <header class="header">
            <a href="../landing/landing.html" style="text-decoration:none;"><nex-care-logo></nex-care-logo></a>
        </header>

        <div class="auth-card reverse" style="margin-top: 20px;">
            <div class="auth-form-section" style="width: 100%;">
                <h2>HOSPITAL REGISTRATION</h2>
                <p style="color: #64748B; font-size: 14px; margin-bottom: 20px;">Register your institution on NexCare. All registrations start in PENDING status for Super User review.</p>

                <div id="registerError" style="display:none; padding: 12px; margin-bottom: 20px; background: #fee2e2; color: #b91c1c; border-radius: 6px; font-size: 14px; font-weight: 500; border: 1px solid #fecaca;"></div>
                <div id="registerSuccess" style="display:none; padding: 12px; margin-bottom: 20px; background: #dcfce7; color: #15803d; border-radius: 6px; font-size: 14px; font-weight: 500; border: 1px solid #bbf7d0;"></div>

                <form id="hospitalRegisterForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Hospital Name</label>
                            <input type="text" id="hospName" class="form-control" minlength="3" maxlength="120" placeholder="e.g. AIIMS Speciality" required>
                        </div>
                        <div class="form-group">
                            <label>Registration Number</label>
                            <input type="text" id="regNum" class="form-control" minlength="4" maxlength="50" placeholder="e.g. AP-MED-517501" required>
                        </div>
                        <div class="form-group">
                            <label>Hospital Type</label>
                            <select id="hospType" class="form-control" required>
                                <option value="Multi-Speciality">Multi-Speciality</option>
                                <option value="Super Speciality">Super Speciality</option>
                                <option value="General Hospital">General Hospital</option>
                                <option value="Clinic">Clinic / Nursing Home</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="city" class="form-control" placeholder="e.g. Tirupati" required>
                        </div>
                        <div class="form-group">
                            <label>State</label>
                            <input type="text" id="state" class="form-control" placeholder="e.g. Andhra Pradesh" required>
                        </div>
                        <div class="form-group">
                            <label>PIN Code</label>
                            <input type="text" id="pincode" class="form-control" inputmode="numeric" pattern="[0-9]{6}" title="Enter a 6-digit PIN code" placeholder="e.g. 517501" required>
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Address</label>
                            <input type="text" id="address" class="form-control" placeholder="Street / Area details" required>
                        </div>
                        <div class="form-group">
                            <label>Total Beds</label>
                            <input type="number" id="totalBeds" class="form-control" min="1" value="100" required>
                        </div>
                        <div class="form-group">
                            <label>ICU Beds</label>
                            <input type="number" id="icuBeds" class="form-control" min="0" value="20" required>
                        </div>
                        <div class="form-group">
                            <label>Admin Name</label>
                            <input type="text" id="adminName" class="form-control" placeholder="Administrator Full Name" required>
                        </div>
                        <div class="form-group">
                            <label>Admin Email</label>
                            <input type="email" id="adminEmail" class="form-control" placeholder="admin@hospital.com" required>
                        </div>
                        <div class="form-group">
                            <label>Admin Phone</label>
                            <input type="tel" id="adminPhone" class="form-control" inputmode="tel" pattern="\+?[0-9][0-9\s\(\)\-]{8,14}" title="Enter a valid 10 to 15 digit phone number" placeholder="10-digit mobile" required>
                        </div>
                        <div class="form-group">
                            <label>Hospital Contact Phone</label>
                            <input type="tel" id="phone" class="form-control" inputmode="tel" pattern="\+?[0-9][0-9\s\(\)\-]{8,14}" title="Enter a valid 10 to 15 digit phone number" placeholder="Landline / Desk phone" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 20px; width: 100%;">
                        Submit Registration
                        <svg class="nexcare-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <polyline points="0,60 25,60 40,25 55,60 70,90 85,60 100,60" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>

                    <div class="auth-links" style="margin-top: 16px; text-align: center;">
                        Return to <a href="../auth/login.html">Main Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../shared/api.js?v=8"></script>
    <script src="../shared/session.js?v=8"></script>
    <script>
        document.getElementById('hospitalRegisterForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!this.reportValidity()) return;
            
            const data = {
                name: document.getElementById('hospName').value.trim(),
                registrationNumber: document.getElementById('regNum').value.trim(),
                type: document.getElementById('hospType').value,
                ownershipType: 'Private',
                city: document.getElementById('city').value.trim(),
                state: document.getElementById('state').value.trim(),
                pincode: document.getElementById('pincode').value.trim(),
                address: document.getElementById('address').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                email: document.getElementById('adminEmail').value.trim(),
                totalBeds: parseInt(document.getElementById('totalBeds').value) || 50,
                icuBeds: parseInt(document.getElementById('icuBeds').value) || 10,
                specialities: ['General Medicine', 'Emergency'],
                emergency24x7: true,
                ambulanceService: true,
                adminName: document.getElementById('adminName').value.trim(),
                adminEmail: document.getElementById('adminEmail').value.trim(),
                adminPhone: document.getElementById('adminPhone').value.trim()
            };

            if (data.icuBeds > data.totalBeds) {
                document.getElementById('registerError').textContent = 'ICU beds cannot exceed total beds.';
                document.getElementById('registerError').style.display = 'block';
                return;
            }

            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');
            const btn = e.target.querySelector('button[type="submit"]');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = 'Submitting...';

            try {
                const res = await window.NexCareAPI.Hospitals.register(data);
                if (res.success) {
                    successDiv.innerHTML = '<strong>Registration Submitted Successfully!</strong><br>Your application is now PENDING verification by the Super User. Redirecting to login...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '../auth/login.html';
                    }, 3500);
                } else {
                    errorDiv.textContent = res.message || 'Registration failed.';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = `Submit Registration
                        <svg class="nexcare-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <polyline points="0,60 25,60 40,25 55,60 70,90 85,60 100,60" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>`;
                }
            } catch (err) {
                errorDiv.textContent = 'Error submitting registration: ' + err.message;
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = `Submit Registration
                    <svg class="nexcare-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <polyline points="0,60 25,60 40,25 55,60 70,90 85,60 100,60" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>`;
            }
        });
    </script>
    <script src="../logo.js"></script>
</body>
</html>
