<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCare Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header class="header">
        <nex-care-logo></nex-care-logo>
    </header>

    <div class="main-card">
        <div class="login-panel">
            <h1 class="title">LOGIN</h1>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="pass-container">
                        <input type="password" required>
                        <span class="eye-icon">👁️</span>
                    </div>
                </div>

                <div class="form-util">
                    <label class="check-container">
                        <input type="checkbox"> <span>Remember me</span>
                    </label>
                    <a href="#" class="blue-link">Forgot Password?</a>
                </div>

                <div class="role-section">
                    <p class="role-label">Role</p>
                    <div class="role-grid">
                        <label><input type="radio" name="role"> Patient</label>
                        <label><input type="radio" name="role"> Administrative Staff</label>
                        <label><input type="radio" name="role"> Hospital Manager</label>
                        <label><input type="radio" name="role"> Ambulance Staff</label>
                    </div>
                </div>

                <button type="submit" class="btn-signin">
                    Sign in
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                </button>

                <p class="signup-text">Don't have an account? <a href="#" class="blue-link">Sign up</a></p>

                <div class="divider">
                    <span></span> OR <span></span>
                </div>

                <button type="button" class="btn-google">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="G">
                    Login with Google
                </button>
            </form>
        </div>

        <div class="image-panel">
            <img src="https://images.unsplash.com/photo-1633167606207-d840b5070fc2?q=80&w=1000" alt="Abstract Background">
        </div>
    </div>

    <script src="login.js"></script>
    <script src="logo.js"></script>
</body>
</html>
