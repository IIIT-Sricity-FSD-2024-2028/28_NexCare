<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Force no-cache so Firefox always loads the latest version -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCare - Support Requests</title>
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/nav.css">
    <style>
        /* Page padding inside main-content */
        .page-body { padding: 32px; }

        /* Hero banner — matches patient portal hero gradient */
        .hero {
            background: linear-gradient(135deg, #2563EB 0%, #0EA5E9 100%);
            padding: 32px;
            border-radius: 14px;
            margin-bottom: 24px;
            color: #FFFFFF;
            animation: fadeInUp 0.5s ease-out;
        }
        .hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
        .hero p  { font-size: 16px; opacity: 0.85; margin: 0; }

        /* Stats grid — matches patient portal stats-grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 14px;
            padding: 24px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            transition: all 0.2s ease;
            animation: fadeInUp 0.5s ease-out;
        }
        .stat-card:hover {
            border-color: #155DFC;
            box-shadow: 0 4px 12px rgba(21, 93, 252, 0.15);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 13px;
            color: #6A7282;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 30px;
            font-weight: 700;
            color: #101828;
            line-height: 1;
        }
        .stat-trend {
            font-size: 12px;
            font-weight: 500;
            margin-top: 8px;
            display: block;
        }
        .trend-up   { color: #00A63E; }
        .trend-down { color: #E7000B; }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .stat-icon.blue   { background: #DBEAFE; }
        .stat-icon.green  { background: #DCFCE7; }
        .stat-icon.purple { background: #F3E8FF; }
        .stat-icon.orange { background: #FFEDD5; }

        /* Header bar — matches patient portal .header */
        .header {
            background: #FFFFFF;
            border-bottom: 1px solid #E5E7EB;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #101828;
        }
        .header-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #2563EB;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }
        .header-user-info p { margin: 0; }
        .header-user-name { font-size: 14px; font-weight: 700; color: #101828; }
        .header-user-role { font-size: 12px; color: #6A7282; }

        /* Quick Actions Section */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #101828;
            margin-bottom: 20px;
            margin-top: 40px;
        }

        .quick-actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .action-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .action-card:hover {
            border-color: #155DFC;
            box-shadow: 0 4px 12px rgba(21, 93, 252, 0.1);
            transform: translateY(-2px);
        }

        .action-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-info h3 {
            font-size: 15px;
            font-weight: 700;
            color: #101828;
            margin: 0 0 2px 0;
        }

        .action-info p {
            font-size: 12px;
            color: #6A7282;
            margin: 0;
        }

        /* Icon Colors */
        .bg-blue   { background: #EFF6FF; }
        .bg-green  { background: #F0FDF4; }
        .bg-purple { background: #FAF5FF; }
        .bg-orange { background: #FFF7ED; }
        .bg-pink   { background: #FDF2F8; }

        /* Recent Activity Table */
        .activity-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 14px;
            padding: 32px;
            margin-top: 24px;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .activity-table {
            width: 100%;
            border-collapse: collapse;
        }

        .activity-table th {
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: #6A7282;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 16px;
            border-bottom: 1px solid #F3F4F6;
        }

        .activity-table td {
            padding: 16px;
            font-size: 14px;
            color: #1E293B;
            border-bottom: 1px solid #F3F4F6;
        }

        .activity-table tr:hover {
            background-color: #F8FAFC;
        }

        .actor-cell {
            font-weight: 700;
            color: #111827;
        }

        .badge-action {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-create { background: #DCFCE7; color: #15803D; }
        .badge-update { background: #DBEAFE; color: #1D4ED8; }
        .badge-delete { background: #FEE2E2; color: #B91C1C; }

        .details-cell {
            max-width: 400px;
            color: #475569;
            line-height: 1.5;
        }
    </style>

    <style>
        /* Shared table/toolbar styling for the approval + support consoles */
        .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
        .toolbar select, .toolbar input {
            height:38px; border:1px solid #E5E7EB; border-radius:8px; padding:0 12px;
            font-size:13px; background:#FFFFFF; color:#111827;
        }
        .toolbar input { min-width:260px; }
        .btn-sm {
            padding:6px 12px; font-size:12px; font-weight:600; border-radius:6px;
            cursor:pointer; border:1px solid transparent; white-space:nowrap;
        }
        .btn-approve { background:#DCFCE7; color:#15803D; border-color:#86EFAC; }
        .btn-approve:hover { background:#BBF7D0; }
        .btn-reject  { background:#FEE2E2; color:#991B1B; border-color:#FCA5A5; }
        .btn-reject:hover { background:#FECACA; }
        .btn-neutral { background:#FFFFFF; color:#374151; border-color:#E5E7EB; }
        .btn-neutral:hover { background:#F9FAFB; }
        .pill {
            display:inline-block; padding:3px 10px; border-radius:999px;
            font-size:11px; font-weight:600; text-transform:capitalize;
        }
        .pill.urgent   { background:#FEE2E2; color:#991B1B; }
        .pill.high     { background:#FFEDD5; color:#9A3412; }
        .pill.medium   { background:#FEF3C7; color:#92400E; }
        .pill.low      { background:#E0E7FF; color:#3730A3; }
        .pill.open              { background:#DBEAFE; color:#1D4ED8; }
        .pill.in_progress       { background:#FEF3C7; color:#92400E; }
        .pill.waiting_for_hospital,
        .pill.waiting_for_manager { background:#FFEDD5; color:#9A3412; }
        .pill.resolved, .pill.closed { background:#DCFCE7; color:#15803D; }
        .muted { color:#6A7282; font-size:12px; margin-top:2px; }
        .activity-table td { vertical-align: top; }
    </style>

</head>
<body>

    <main class="main-content">

        <header class="header">
            <span class="header-title">Support Requests</span>
            <div class="header-user">
                <div class="header-avatar" id="userInitials">RO</div>
                <div class="header-user-info">
                    <p class="header-user-name" id="userNameDisplay">Regional Officer</p>
                    <p class="header-user-role">Regional Manager</p>
                </div>
            </div>
        </header>

        <div class="page-body">

            <div class="hero">
                <h1>Support Requests</h1>
                <p>Operational issues raised by the hospitals you oversee.</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <p class="stat-label">Open</p>
                        <p class="stat-value" id="openCount">--</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <p class="stat-label">Needs My Action</p>
                        <p class="stat-value" id="mineCount">--</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <p class="stat-label">Urgent</p>
                        <p class="stat-value" id="urgentCount">--</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <p class="stat-label">Resolved</p>
                        <p class="stat-value" id="resolvedCount">--</p>
                    </div>
                </div>
            </div>

            <div class="activity-card">
                <div class="activity-header">
                    <h2 class="section-title" style="margin:0;">Requests</h2>
                </div>
                <div class="toolbar" style="padding:0 20px;">
                    <select id="statusFilter">
                        <option value="all">All statuses</option>
                        <option value="open">Open</option>
                        <option value="in_progress">In progress</option>
                        <option value="waiting_for_manager">Waiting for me</option>
                        <option value="waiting_for_hospital">Waiting for hospital</option>
                        <option value="resolved">Resolved</option>
                        <option value="closed">Closed</option>
                    </select>
                    <select id="hospitalFilter">
                        <option value="all">All my hospitals</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Search subject or category">
                </div>
                <table class="activity-table">
                    <thead>
                        <tr>
                            <th>Request</th>
                            <th>Hospital</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Raised</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTableBody">
                        <tr><td colspan="6" style="text-align:center; color:#6A7282;">Loading requests...</td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <script src="../shared/api.js?v=8"></script>
    <script src="../shared/session.js?v=8"></script>
    <script>
        if (typeof checkAuth === "function") {
            checkAuth();
            checkRoleAccess();
        }
    </script>
    <script src="../shared/db.js?v=5"></script>
    <script src="../logo.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="support-requests.js"></script>
        <script>
        // JWT-based early auth guard (runs before body renders, prevents flash)
        (function () {
            function decodeJWT(token) {
                try {
                    var parts = token.split('.');
                    if (parts.length !== 3) return null;
                    var raw = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                    var json = decodeURIComponent(atob(raw).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(json);
                } catch(e) { return null; }
            }
            var token = sessionStorage.getItem('nexcare_auth_token') || localStorage.getItem('nexcare_auth_token');
            var payload = token ? decodeJWT(token) : null;
            var now = Math.floor(Date.now() / 1000);
            if (!payload || (payload.exp && now > payload.exp) || payload.role !== 'regional_manager') {
                sessionStorage.clear();
                window.location.replace('../auth/login.html');
            }
            // Sync legacy keys so other inline scripts don't break
            if (payload) {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('nexcare_current_role', payload.role);
            }
        })();
    </script>
</body>
</html>
