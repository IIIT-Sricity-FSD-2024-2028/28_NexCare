<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Hospital - NexCare Multi-Hospital Platform</title>
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/nav.css">
    <style>
        .registration-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row > .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .section-title {
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
            color: #2c3e50;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            font-weight: normal;
        }
        .checkbox-label input {
            width: auto;
            margin-right: 10px;
        }
        button.submit-btn {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
        }
        button.submit-btn:hover {
            background-color: #2980b9;
        }
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            display: none;
        }
        .alert.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <nav id="navbar">
        <div class="container">
            <div class="nav-content">
                <a href="landing.html" style="text-decoration: none; color: #2c3e50; font-size: 24px; font-weight: bold;">NexCare</a>
                <div class="nav-links">
                    <a href="landing.html" class="nav-link">Home</a>
                    <a href="../auth/login.html" class="nav-link">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="registration-container">
        <h2>Register Your Hospital</h2>
        <p>Join the NexCare network to manage your hospital operations efficiently.</p>
        
        <div id="alert-box" class="alert"></div>

        <form id="hospital-registration-form">
            <h3 class="section-title">Hospital Details</h3>
            
            <div class="form-group">
                <label for="hospitalName">Hospital Name *</label>
                <input type="text" id="hospitalName" name="name" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="regNumber">Registration Number *</label>
                    <input type="text" id="regNumber" name="registrationNumber" minlength="4" maxlength="50" required>
                </div>
                <div class="form-group">
                    <label for="hospitalType">Hospital Type *</label>
                    <select id="hospitalType" name="type" required>
                        <option value="">Select Type</option>
                        <option value="Multi-Speciality">Multi-Speciality</option>
                        <option value="Super-Speciality">Super-Speciality</option>
                        <option value="General Hospital">General Hospital</option>
                        <option value="Clinic">Clinic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ownershipType">Ownership Type *</label>
                    <select id="ownershipType" name="ownershipType" required>
                        <option value="">Select Ownership</option>
                        <option value="Public">Public/Government</option>
                        <option value="Private">Private</option>
                        <option value="Trust/NGO">Trust/NGO</option>
                    </select>
                </div>
            </div>

            <h3 class="section-title">Contact & Location</h3>
            <div class="form-group">
                <label for="address">Address *</label>
                <input type="text" id="address" name="address" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="city">City *</label>
                    <input type="text" id="city" name="city" required>
                </div>
                <div class="form-group">
                    <label for="state">State *</label>
                    <input type="text" id="state" name="state" required>
                </div>
                <div class="form-group">
                    <label for="pincode">PIN Code *</label>
                    <input type="text" id="pincode" name="pincode" inputmode="numeric" pattern="[0-9]{6}" title="Enter a 6-digit PIN code" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Official Phone *</label>
                    <input type="tel" id="phone" name="phone" inputmode="tel" pattern="\+?[0-9][0-9\s()\-]{8,14}" title="Enter a valid 10 to 15 digit phone number" required>
                </div>
                <div class="form-group">
                    <label for="email">Official Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>

            <h3 class="section-title">Capacity & Facilities</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="totalBeds">Total Beds *</label>
                    <input type="number" id="totalBeds" name="totalBeds" min="1" required>
                </div>
                <div class="form-group">
                    <label for="icuBeds">ICU Beds *</label>
                    <input type="number" id="icuBeds" name="icuBeds" min="0" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="emergency" name="emergency24x7"> 24/7 Emergency Available
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="ambulance" name="ambulanceService"> Ambulance Service Available
                    </label>
                </div>
            </div>

            <h3 class="section-title">Hospital Administrator</h3>
            <p style="font-size: 14px; color: #666; margin-bottom: 15px;">This person will receive the verification updates and manage the hospital team once verified.</p>
            
            <div class="form-group">
                <label for="adminName">Administrator Name *</label>
                <input type="text" id="adminName" name="adminName" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="adminEmail">Administrator Email *</label>
                    <input type="email" id="adminEmail" name="adminEmail" required>
                </div>
                <div class="form-group">
                    <label for="adminPhone">Administrator Phone *</label>
                    <input type="tel" id="adminPhone" name="adminPhone" inputmode="tel" pattern="\+?[0-9][0-9\s()\-]{8,14}" title="Enter a valid 10 to 15 digit phone number" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">Submit Registration Request</button>
        </form>
    </div>

    <!-- Script references -->
    <script src="../shared/api.js"></script>
    <script>
        document.getElementById('hospital-registration-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!e.target.reportValidity()) return;
            
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.querySelector('.submit-btn');
            
            alertBox.className = 'alert';
            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            // Handle numeric and boolean fields manually
            data.totalBeds = parseInt(data.totalBeds, 10);
            data.icuBeds = parseInt(data.icuBeds, 10);
            data.emergency24x7 = !!data.emergency24x7;
            data.ambulanceService = !!data.ambulanceService;
            data.specialities = ["General"]; // Simplified for this demo

            if (data.icuBeds > data.totalBeds) {
                alertBox.className = 'alert error';
                alertBox.textContent = 'ICU beds cannot exceed total beds.';
                return;
            }

            try {
                const response = await window.NexCareAPI.Hospitals.register(data);
                
                if (response.success) {
                    alertBox.className = 'alert success';
                    alertBox.innerHTML = '<strong>Success!</strong> Your hospital registration request has been submitted. It is now Pending Verification.';
                    e.target.reset();
                } else {
                    alertBox.className = 'alert error';
                    alertBox.innerHTML = `<strong>Error:</strong> ${response.message}`;
                }
            } catch (err) {
                alertBox.className = 'alert error';
                alertBox.innerHTML = '<strong>Error:</strong> Network error. Please try again later.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Registration Request';
            }
        });
    </script>
</body>
</html>
