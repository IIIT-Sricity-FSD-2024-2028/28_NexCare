<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCare - Login</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <header class="header">
        <nex-care-logo></nex-care-logo>
    </header>
        <div class="auth-card">
            <div class="auth-form-section">
                <h2>LOGIN</h2>
                
                <form id="loginForm" onsubmit="handleAuth(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-control" required>
                    </div>

                    <div class="form-actions-row">
                        <label style="font-weight: normal; font-size: 14px; color: #666;">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#">Forgot Password?</a>
                    </div>

                    <label style="font-size: 14px; font-weight: 600; margin-bottom: 5px; display: block;">Role</label>
                    <div class="role-grid">
                        <label class="role-option">
                            <input type="radio" name="role" value="patient" required> Patient
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="administrative_staff" required> Admininstrative Staff
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="superuser" required> Super User (System)
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="ambulance" required> Ambulance Staff
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">
    Sign in
    <svg class="nexcare-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <polyline 
        points="0,60 25,60 40,25 55,60 70,90 85,60 100,60"
        fill="none"
        stroke="white"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
</button>
                    
                    <div class="auth-links">
                        Don't have an account? <a href="signup.html">Sign up</a>
                    </div>

                    <div class="or-divider">OR</div>

                    <button type="button" class="btn-google">
    <svg style="height: 18px; margin-right: 10px;" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Login with Google
</button>
                </form>
            </div>

            <div class="auth-image-section"></div>
        </div>
    </div>

    <script src="../shared/session.js"></script>
    <script>
        // Mock Database of Valid Credentials
        const VALID_USERS = [
            { email: 'superuser@nexcare.com', password: 'Password123', role: 'superuser' },
            { email: 'administrative_staff@nexcare.com', password: 'Password123', role: 'administrative_staff' },
            { email: 'ambulance@nexcare.com', password: 'Password123', role: 'ambulance' },
            { email: 'patient@gmail.com', password: 'Password123', role: 'patient' }
        ];

        function handleAuth(event) {
            event.preventDefault(); 
            
            const emailInput = document.querySelector('input[type="email"]').value.trim();
            const passwordInput = document.querySelector('input[type="password"]').value;
            const selectedRole = document.querySelector('input[name="role"]:checked').value;

            // 1. Check if patient exists in the dynamically created localStorage (from Signup)
            if (selectedRole === 'patient') {
                const patientsData = localStorage.getItem('nexcare_patients');
                if (patientsData) {
                    const patients = JSON.parse(patientsData);
                    const foundPatient = patients.find(p => p.email === emailInput);
                    if (foundPatient) {
                        if (foundPatient.password === passwordInput) {
                            loginUser(selectedRole);
                            return;
                        } else {
                            // Stop executing and fall through to the alert error below
                        }
                    }
                }
            }

            // 2. Check against strictly enforced internal Staff mock accounts
            const userMatch = VALID_USERS.find(user => 
                user.email === emailInput && 
                user.password === passwordInput && 
                user.role === selectedRole
            );

            if(userMatch) {
                loginUser(selectedRole); 
            } else {
                alert("Invalid Email, Password, or Role selection! Please try again.");
            }
        }
    </script>
    <script src="../logo.js"></script>
</body>
</html>
