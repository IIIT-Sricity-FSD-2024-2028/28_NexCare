<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCare - Sign Up</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-wrapper">
        <header class="header">
        <nex-care-logo></nex-care-logo>
    </header>

        <div class="auth-card reverse">
            <div class="auth-form-section">
                <h2>SIGN UP</h2>

                <form id="signupForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" class="form-control" pattern="[0-9]{10}" title="Please enter exactly 10 digits" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" class="form-control" required>
                    </div>

                         <button type="submit" class="btn-primary">
    Sign up
    <svg class="nexcare-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <polyline 
        points="0,60 25,60 40,25 55,60 70,90 85,60 100,60"
        fill="none"
        stroke="white"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
</button>

                    <div class="auth-links">
                        Already have an account? <a href="login.html">Sign in</a>
                    </div>
                </form>
            </div>

            <div class="auth-image-section"></div>
        </div>
    </div>

    <script src="../shared/session.js"></script>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            console.log("Signup triggered...");

            // 1. Get user data from inputs
            const inputs = document.querySelectorAll('.form-control');
            
            // Validate phone number (must be exactly 10 digits)
            const phoneVal = inputs[2].value;
            const phoneRegex = /^\d{10}$/;
            if (!phoneRegex.test(phoneVal)) {
                alert("Phone number must be exactly 10 digits (numbers only)!");
                return;
            }

            // Check if passwords match
            if (inputs[3].value !== inputs[4].value) {
                alert("Passwords do not match!");
                return;
            }

            const newPatient = {
                id: Date.now(),
                name: inputs[0].value,
                email: inputs[1].value,
                phone: inputs[2].value,
                password: inputs[3].value,
                role: 'patient',
                status: 'Active'
            };

            // 2. Fetch existing mock database from Local Storage, or create new array
            let patientsData = localStorage.getItem('nexcare_patients');
            let patientsArray = patientsData ? JSON.parse(patientsData) : [];

            // 3. Add to mock database and save back to local storage
            patientsArray.push(newPatient);
            localStorage.setItem('nexcare_patients', JSON.stringify(patientsArray));

            console.log("Mock DB Updated:", JSON.parse(localStorage.getItem('nexcare_patients')));

            // 4. Log them in
            if (typeof loginUser === "function") {
                loginUser('patient'); 
            } else {
                alert("Error: session.js could not be found.");
            }
        });
    </script>
    <script src="../logo.js"></script>
</body>

</html>
