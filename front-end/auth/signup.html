<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCare - Sign Up</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-wrapper">
        <div class="logo-container"
            style="display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
            <img src="../assets/logo.png" alt="NexCare Logo" style="height: 40px; margin-right: 12px;">
            <h1 style="margin: 0; font-size: 28px; font-weight: 800; color: #0076b6; letter-spacing: 1px;">NEX CARE</h1>
        </div>

        <div class="auth-card reverse">

            <div class="auth-form-section">
                <h2>SIGN UP</h2>

                <form>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 15px;">Sign up</button>

                    <div class="auth-links">
                        Already have an account? <a href="login.html">Sign in</a>
                    </div>
                </form>
            </div>

            <div class="auth-image-section"></div>
        </div>
    </div>

</body>

</html>
