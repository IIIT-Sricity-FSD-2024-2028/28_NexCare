<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>NexCare - Set New Password</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="../shared/global.css">
</head>
<body>
    <div class="auth-wrapper" style="max-width: 540px;">
        <header class="header">
            <a href="../landing/landing.html" style="text-decoration:none;"><nex-care-logo></nex-care-logo></a>
        </header>

        <div class="auth-card" style="min-height: auto; padding: 20px;">
            <div class="auth-form-section" style="padding: 15px 20px;">
                <div style="text-align:center; margin-bottom:18px;">
                    <div style="width:48px; height:48px; border-radius:50%; background:#eff6ff; color:#2563eb; display:flex; align-items:center; justify-content:center; margin:0 auto 10px auto;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <h2 style="margin:0 0 6px 0; font-size:22px; color:#0f172a;">Set Your New Password</h2>
                    <p style="font-size:13px; color:#64748b; margin:0; line-height:1.4;">
                        Welcome to NexCare! For security, newly registered accounts must change their temporary password on first login.
                    </p>
                </div>

                <div id="alertBox" style="display:none; padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:14px;"></div>

                <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
                    <div class="form-group">
                        <label>Current (Temporary) Password *</label>
                        <input type="password" id="currentPassword" class="form-control" placeholder="Enter current / temporary password" required>
                    </div>

                    <div class="form-group">
                        <label>New Password *</label>
                        <input type="password" id="newPassword" class="form-control" placeholder="Create a new password (min 6 characters)" required oninput="checkRules()">
                        <div style="font-size:11.5px; color:#64748b; margin-top:4px;">Cannot be the default password (<code>NexCare@123</code>).</div>
                    </div>

                    <div class="form-group">
                        <label>Confirm New Password *</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter new password" required oninput="checkRules()">
                    </div>

                    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:10px 14px; margin-bottom:18px; font-size:12px; color:#475569;">
                        <div id="ruleLength" style="color:#64748b;">● Minimum 6 characters</div>
                        <div id="ruleMatch" style="color:#64748b;">● Passwords must match</div>
                        <div id="ruleDiff" style="color:#64748b;">● Different from temporary default password</div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-primary" style="width:100%; justify-content:center; padding:12px; font-size:15px;">
                        Update Password & Continue →
                    </button>

                    <div style="text-align:center; margin-top:16px;">
                        <a href="login.html" style="font-size:13px; color:#64748b; text-decoration:none;">Cancel and return to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../shared/api.js"></script>
    <script src="../shared/session.js"></script>
    <script src="logo.js"></script>
    <script>
        const DEFAULT_PASS = 'NexCare@123';

        function checkRules() {
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            const ruleLength = document.getElementById('ruleLength');
            const ruleMatch = document.getElementById('ruleMatch');
            const ruleDiff = document.getElementById('ruleDiff');

            if (newPass.length >= 6) {
                ruleLength.style.color = '#16a34a';
                ruleLength.textContent = '✓ Minimum 6 characters';
            } else {
                ruleLength.style.color = '#64748b';
                ruleLength.textContent = '● Minimum 6 characters';
            }

            if (newPass && confirmPass && newPass === confirmPass) {
                ruleMatch.style.color = '#16a34a';
                ruleMatch.textContent = '✓ Passwords match';
            } else {
                ruleMatch.style.color = '#64748b';
                ruleMatch.textContent = '● Passwords must match';
            }

            if (newPass && newPass !== DEFAULT_PASS) {
                ruleDiff.style.color = '#16a34a';
                ruleDiff.textContent = '✓ Different from default password';
            } else {
                ruleDiff.style.color = '#64748b';
                ruleDiff.textContent = '● Different from temporary default password';
            }
        }

        async function handleChangePassword(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) {
                showAlert('New password must be at least 6 characters long.', 'error');
                return;
            }
            if (newPassword === DEFAULT_PASS) {
                showAlert('New password cannot be the temporary default password (NexCare@123).', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showAlert('New password and confirm password do not match.', 'error');
                return;
            }
            if (currentPassword === newPassword) {
                showAlert('New password must be different from current password.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating Password...';

            try {
                const res = await NexCareAPI.Auth.changePassword({
                    currentPassword,
                    newPassword
                });

                if (res.success) {
                    showAlert('Password updated successfully! Redirecting to your dashboard...', 'success');
                    
                    // Clear mustChangePassword in stored user data
                    const userDataStr = sessionStorage.getItem('nexcare_user_data') || localStorage.getItem('nexcare_user_data');
                    if (userDataStr) {
                        try {
                            const u = JSON.parse(userDataStr);
                            u.mustChangePassword = false;
                            sessionStorage.setItem('nexcare_user_data', JSON.stringify(u));
                            localStorage.setItem('nexcare_user_data', JSON.stringify(u));
                        } catch {}
                    }

                    const role = sessionStorage.getItem('nexcare_current_role') || 'administrative_staff';
                    setTimeout(() => {
                        loginUser(role);
                    }, 1200);
                } else {
                    showAlert(res.message || 'Failed to update password. Please check your current password.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Update Password & Continue →';
                }
            } catch (err) {
                console.error(err);
                showAlert(err.message || 'Error updating password.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password & Continue →';
            }
        }

        function showAlert(msg, type) {
            const el = document.getElementById('alertBox');
            el.style.display = 'block';
            el.textContent = msg;
            if (type === 'success') {
                el.style.background = '#dcfce7';
                el.style.color = '#15803d';
                el.style.border = '1px solid #bbf7d0';
            } else {
                el.style.background = '#fee2e2';
                el.style.color = '#b91c1c';
                el.style.border = '1px solid #fecaca';
            }
        }
    </script>
</body>
</html>
