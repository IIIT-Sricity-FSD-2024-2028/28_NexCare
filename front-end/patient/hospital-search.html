<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Hospitals - NexCare Patient Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <a class="sidebar-brand" href="../landing/landing.html" aria-label="NexCare Home">
            <nex-care-logo></nex-care-logo>
            <span class="sidebar-brand-subtitle">Patient Portal</span>
        </a>

        <nav class="nav-menu">
            <a href="../landing/landing.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M2.5 10L10 2.5L17.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 8.333V15.833C5 16.2935 5.3731 16.7348 5.84171 17.2034C6.31032 17.672 6.75163 18.0451 7.21212 18.0451H12.7879C13.2484 18.0451 13.6897 17.672 14.1583 17.2034C14.6269 16.7348 15 16.2935 15 15.833V8.333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="hospital-search.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M14 14l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Search Hospitals</span>
            </a>
            <a href="../auth/login.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M15 8.333V5.833C15 4.31252 14.3978 2.85373 13.3284 1.78427C12.259 0.714812 10.8002 0.1125 9.27973 0.1125C7.75922 0.1125 6.30046 0.714812 5.231 1.78427C4.16154 2.85373 3.55923 4.31252 3.55923 5.833V8.333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9.27973 11.667V15.833" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6.1124 13.333H12.4471" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2.5 8.333H16.0592" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="2.5" y="8.333" width="13.5592" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <span>Login to Book</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header with Back Button -->
        <header class="header" style="justify-content: flex-start; gap: 16px;">
            <a href="../landing/landing.html" class="btn-outline-sm" id="backToDashboardBtn" style="display: flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 600;">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M10 12L4 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back to Home
            </a>
            <h1 style="font-size: 20px; font-weight: 700; color: #111827; margin: 0;">Search Hospitals</h1>
        </header>

        <!-- Main Body -->
        <div style="padding: 32px;">
            <!-- Filter Controls Card -->
            <div class="section-card" style="margin-bottom: 24px; padding: 24px;">
                <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #1F2937;">Search & Filter</h2>
                <form id="hospitalSearchForm" onsubmit="return false;" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; align-items: end;">
                    <div>
                        <label for="specialitySelect" style="display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px;">Speciality</label>
                        <select id="specialitySelect" style="width: 100%; padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 14px; background: #FFF; outline: none;">
                            <option value="">All Specialities</option>
                            <option value="General Medicine">General Medicine</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopaedics">Orthopaedics</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Paediatrics">Paediatrics</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="Dermatology">Dermatology</option>
                            <option value="Gynaecology">Gynaecology</option>
                            <option value="Gynecology">Gynecology</option>
                            <option value="Emergency Medicine">Emergency Medicine</option>
                            <option value="Oncology">Oncology</option>
                        </select>
                    </div>

                    <div>
                        <label for="cityInput" style="display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px;">City</label>
                        <input type="text" id="cityInput" placeholder="Enter city name..." style="width: 100%; padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 14px; outline: none;">
                    </div>

                    <div>
                        <label for="pincodeInput" style="display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px;">PIN Code</label>
                        <input type="text" id="pincodeInput" placeholder="Enter PIN code..." style="width: 100%; padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 14px; outline: none;">
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button type="button" id="searchBtn" class="btn-primary" style="flex: 1; padding: 10px 16px; font-size: 14px; font-weight: 600; justify-content: center;">
                            Search
                        </button>
                        <button type="button" id="clearBtn" class="btn-outline-sm" style="padding: 10px 16px; font-size: 14px; font-weight: 600;">
                            Clear Filters
                        </button>
                    </div>
                </form>
            </div>

            <!-- Status Alert Container -->
            <div id="statusContainer" style="margin-bottom: 16px;"></div>

            <!-- Results Grid -->
            <div id="resultsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
                <!-- Hospital cards dynamically loaded -->
            </div>
        </div>
    </main>

    <script src="../logo.js"></script>
    <script src="../shared/api.js?v=8"></script>
    <script src="../shared/mock-hospitals.js"></script>
    <script src="hospital-search.js"></script>
</body>
</html>
