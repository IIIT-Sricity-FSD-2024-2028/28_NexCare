<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Management</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../shared/logo.css">

    <script defer src="../shared/logo.js"></script>
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <nex-care-logo></nex-care-logo>

        <ul class="menu">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li>Manage Appointments</li>
            <li>Patient Check-in</li>
            <li><a href="bed-allocation.html">Bed Allocation</a></li>
            <li class="active">Inventory</li>
            <li>Staff Scheduling</li>
            <li><a href="generate-bill.html">Generate Bill</a></li>
        <li>Feedback</li>
        </ul>

        <div style="margin-top:40px;">Logout</div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <div class="user">Admin User</div>
        </div>

        <!-- HEADER -->
        <div class="header-row">
            <div>
                <h2>Inventory Management</h2>
            </div>
        </div>

        <!-- STATS -->
        <div class="cards">
            <div class="card stat">
                <p>Total Items</p>
                <h3 id="totalItems" class="blue-text">12</h3>
            </div>

            <div class="card stat green">
                <p>In Stock</p>
                <h3 id="inStock" class="green-text">8</h3>
            </div>

            <div class="card stat yellow">
                <p>Low Stock</p>
                <h3 id="lowStock" class="orange-text">4</h3>
            </div>
        </div>
        
        <input id="searchInput" class="search" placeholder="Search inventory items..." />
        
        <!-- TABLE -->
        <div class="card table-container">
            <table>
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Quantity Available</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable"></tbody>
            </table>
        </div>

    </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="card modal-card">
        <h3>Edit Item</h3>

        <input id="itemName" class="input" disabled>
        <input id="quantity" class="input" placeholder="Quantity">

        <div class="modal-actions">
            <button class="btn" onclick="saveItem()">Save</button>
            <button class="btn-outline" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script type="module" src="../assets/js/inventory.js"></script>

</body>
</html>
