<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Super User | NexCare</title>
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/nav.css">
    <style>
        /* Page padding */
        .page-body { padding: 32px; }

        /* Sticky top header bar — matches patient portal */
        .header {
            background: #FFFFFF;
            border-bottom: 1px solid #E5E7EB;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-title { font-size: 18px; font-weight: 700; color: #101828; }
        .header-user { display: flex; align-items: center; gap: 10px; }
        .header-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: #2563EB; color: #FFFFFF;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px;
        }
        .header-user-name { font-size: 14px; font-weight: 700; color: #101828; margin: 0; }
        .header-user-role { font-size: 12px; color: #6A7282; margin: 0; }

        /* Page header card */
        .page-header {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInUp 0.4s ease-out;
        }
        .page-header h1 { margin: 0; font-size: 20px; font-weight: 700; color: #101828; }
        .page-header p  { margin: 4px 0 0; font-size: 14px; color: #6A7282; }

        /* Table wrapper */
        .table-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 14px;
            overflow: hidden;
            animation: fadeInUp 0.4s ease-out;
        }

        /* Badges override with patient-portal palette */
        .badge.admin    { background: #DBEAFE; color: #1447E6; }
        .badge.doctor   { background: #DCFCE7; color: #016630; border: 1px solid #7BF1A8; }
        .badge.driver   { background: #FEF9C2; color: #A65F00; border: 1px solid #F7D24C; }
        .badge.Active   { background: #DCFCE7; color: #016630; }
        .badge.Inactive { background: #F3F4F6; color: #6B7280; }
        .badge.Suspended{ background: #FEE2E2; color: #DC2626; }

        .btn-icon {
            padding: 6px 10px;
            font-size: 12px;
            margin-right: 4px;
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s;
        }
        .btn-icon:hover { background: #EFF6FF; border-color: #155DFC; color: #155DFC; }
        .btn-icon.danger:hover { background: #FEF2F2; border-color: #E7000B; color: #E7000B; }
    </style>
</head>
<body>

    <main class="main-content">

        <!-- Sticky top header inside main -->
        <header class="header">
            <span class="header-title">System User Management</span>
            <div class="header-user">
                <div class="header-avatar">SU</div>
                <div>
                    <p class="header-user-name">Super User</p>
                    <p class="header-user-role">System Administrator</p>
                </div>
            </div>
        </header>

        <div class="page-body">
        <div class="page-header">
            <div>
                <h1>System User Management</h1>
                <p style="margin: 5px 0 0; color: var(--text-muted); font-size: 14px;">Manage system access, roles, and profiles for hospital staff.</p>
            </div>
            <div class="action-row">
                <button class="btn-primary" onclick="openUserModal()">+ Add New User</button>
            </div>
        </div>

        <div class="table-card">
        <table class="data-table" id="usersTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- Data populated dynamically via JS -->
            </tbody>
        </table>

        <!-- User Form Modal -->
        <div class="modal-overlay" id="userModalOverlay">
            <div class="modal-content">
                <h2 id="modalTitle" style="margin-top: 0">Add New User</h2>
                <form id="userForm" onsubmit="handleSaveUser(event)" novalidate>
                    <input type="hidden" id="userId">
                    
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="userName" class="form-control">
                        <span class="error-message" id="errorName">Name is required.</span>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="userEmail" class="form-control">
                        <span class="error-message" id="errorEmail">Valid email is required.</span>
                    </div>

                    <div class="form-group" style="display: flex; gap: 15px;">
                        <div style="flex: 1;">
                            <label>Role</label>
                            <select id="userRole" class="form-control" onchange="updateDeptDropdown(this.value)">
                                <option value="">Select Role...</option>
                                <option value="admin">Operations Admin</option>
                                <option value="doctor">Doctor</option>
                                <option value="driver">Ambulance Driver</option>
                            </select>
                            <span class="error-message" id="errorRole">Role is required.</span>
                        </div>
                        <div style="flex: 1;">
                            <label>Department</label>
                            <select id="userDept" class="form-control">
                                <option value="Management">Management</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Emergency">Emergency</option>
                                <option value="Transport">Transport</option>
                            </select>
                            <span class="error-message" id="errorDept">Dept is required.</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="userStatus" class="form-control">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                            <option value="Suspended">Suspended</option>
                        </select>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px;">
                        <button type="button" class="btn-secondary" onclick="closeUserModal()">Cancel</button>
                        <button type="submit" class="btn-primary">Save User</button>
                    </div>
                </form>
            </div>
        </div>
        </div> <!-- /.table-card -->

        </div> <!-- /.page-body -->
    </main>

    <script src="../shared/session.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="../logo.js"></script>
    <script>
        // Security logic for superuser
        document.addEventListener('DOMContentLoaded', () => {
            const role = sessionStorage.getItem('nexcare_current_role');
            if (role !== 'superuser') {
                alert("Unauthorized Access. System Administrators only.");
                window.location.href = '../auth/login.html';
            }
        });
    </script>
    <script src="manage-users.js"></script>
</body>
</html>
