<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCare - Super User Dashboard</title>
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/nav.css">
    <style>
        .welcome-section {
            margin-bottom: 30px;
            background: white;
            padding: 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
        }
        .welcome-section h1 { margin-top: 0; color: var(--dark-panel); }
        .welcome-section p { margin-bottom: 0; color: var(--text-muted); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border-top: 4px solid var(--primary-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        .stat-card h3 { color: var(--text-muted); font-size: 14px; margin-top: 0; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-card p { font-size: 32px; font-weight: 700; color: var(--text-main); margin: 0; }
        .trend { font-size: 12px; font-weight: 500; margin-top: 10px; display: block; }
        .trend.up { color: var(--success); }
        .trend.down { color: var(--danger); }
    </style>
</head>
<body>

    <main class="main-content">
        <div class="welcome-section">
            <h1>System Command Center</h1>
            <p>Welcome back, System Administrator. Global system overview.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total System Users</h3>
                <p id="totalUsersCount">--</p>
                <span class="trend up">Active Staff Directory</span>
            </div>
            <div class="stat-card">
                <h3>System Uptime</h3>
                <p>99.9%</p>
                <span class="trend up">↑ Last 30 Days</span>
            </div>
            <div class="stat-card">
                <h3>Database Health</h3>
                <p>Optimal</p>
                <span class="trend up">0 Sync Errors</span>
            </div>
            <div class="stat-card">
                <h3>Active Sessions</h3>
                <p>42</p>
                <span class="trend down">↓ 5 from yesterday</span>
            </div>
        </div>
    </main>

    <script src="../shared/session.js"></script>
    <script src="../shared/nav.js"></script>
    <script>
        // Security Check: Make sure only 'superuser' can see this
        document.addEventListener('DOMContentLoaded', () => {
            const role = sessionStorage.getItem('nexcare_current_role');
            if (role !== 'superuser') {
                alert("Unauthorized Access. System Administrators only.");
                window.location.href = '../auth/login.html';
            }

            // Sync total users count
            const storedUsers = localStorage.getItem('nexcare_users');
            if(storedUsers) {
                const arr = JSON.parse(storedUsers);
                document.getElementById('totalUsersCount').textContent = arr.length;
            } else {
                document.getElementById('totalUsersCount').textContent = '3';
            }
        });
    </script>
</body>
</html>
