<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Force no-cache so Firefox always loads the latest version -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Review | Super User | NexCare</title>
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/nav.css">
    <style>
        .page-body { padding: 24px; }
        .header {
            background: #FFFFFF;
            border-bottom: 1px solid #E5E7EB;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-title { font-size: 16px; font-weight: 600; color: #101828; }
        .header-user { display: flex; align-items: center; gap: 10px; }
        .header-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: #2563EB; color: #FFFFFF;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 12px;
        }
        .header-user-name { font-size: 13px; font-weight: 600; color: #101828; margin: 0; }
        .header-user-role { font-size: 11px; color: #6A7282; margin: 0; }
        .page-header {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInUp 0.4s ease-out;
        }
        .page-header h1 { margin: 0; font-size: 20px; font-weight: 700; color: #101828; }
        .page-header p  { margin: 4px 0 0; font-size: 14px; color: #6A7282; }
        .table-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 14px;
            overflow: hidden;
            animation: fadeInUp 0.4s ease-out;
        }

        .badge.Patient { background: #DBEAFE; color: #1447E6; }
        .badge.Staff { background: #E0E7FF; color: #3730A3; }

        .btn-icon {
            padding: 6px 10px;
            font-size: 12px;
            margin-right: 4px;
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s;
        }
        .btn-icon:hover { background: #EFF6FF; border-color: #155DFC; color: #155DFC; }
        .btn-icon.danger:hover { background: #FEF2F2; border-color: #E7000B; color: #E7000B; }
        
        .stars { color: #f59e0b; font-size: 14px; }
        
        /* Modal Implementation */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-card {
            background: white; border-radius: 12px; width: 100%; max-width: 500px;
            padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { margin: 0; font-size: 18px; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; }
        .modal-body { font-size: 14px; color: #374151; line-height: 1.6; }
    </style>
</head>
<body>

    <main class="main-content">
        <header class="header">
            <span class="header-title">System Administrator Portal</span>
            <div class="header-user">
                <div class="header-avatar">SU</div>
                <div>
                    <p class="header-user-name">Super User</p>
                    <p class="header-user-role">System Administrator</p>
                </div>
            </div>
        </header>

        <div class="page-body">
            <div class="page-header">
                <div>
                    <h1>Feedback Review</h1>
                    <p style="margin: 5px 0 0; color: var(--text-muted); font-size: 14px;">Review system feedback provided by patients and staff.</p>
                </div>
                <div class="action-row" style="display:flex; gap:10px;">
                    <select id="filterType" class="form-control">
                        <option value="All">All Types</option>
                        <option value="Patient">Patients</option>
                        <option value="Staff">Staff</option>
                    </select>
                    <input type="text" id="searchTable" placeholder="Search Feedback..." class="form-control" style="width: 250px;">
                </div>
            </div>

            <div class="table-card">
                <table class="data-table" id="feedbackTable">
                    <thead>
                        <tr>
                            <th>Feedback ID</th>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Sender</th>
                            <th>Subject</th>
                            <th>Rating</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="feedbackTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div> <!-- /.table-card -->
        </div> <!-- /.page-body -->
    </main>
    
    <!-- View Modal -->
    <div class="modal-overlay" id="viewFeedbackModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Feedback Details</h2>
                <button class="modal-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="modal-body" id="feedbackDetailsContainer">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script src="../shared/api.js?v=8"></script>
    <script src="../shared/session.js?v=8"></script>
    <script src="../shared/nav.js"></script>
    <script src="../shared/db.js"></script>
    <script src="../logo.js"></script>
        <script>
        // JWT-based early auth guard (runs before body renders, prevents flash)
        (function () {
            function decodeJWT(token) {
                try {
                    var parts = token.split('.');
                    if (parts.length !== 3) return null;
                    var raw = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                    var json = decodeURIComponent(atob(raw).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(json);
                } catch(e) { return null; }
            }
            var token = sessionStorage.getItem('nexcare_auth_token') || localStorage.getItem('nexcare_auth_token');
            var payload = token ? decodeJWT(token) : null;
            var now = Math.floor(Date.now() / 1000);
            if (!payload || (payload.exp && now > payload.exp) || payload.role !== 'superuser') {
                sessionStorage.clear();
                window.location.replace('../auth/login.html');
            }
            // Sync legacy keys so other inline scripts don't break
            if (payload) {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('nexcare_current_role', payload.role);
            }
        })();
    </script>
    <script src="feedback.js"></script>
</body>
</html>
