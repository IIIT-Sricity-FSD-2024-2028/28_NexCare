<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments | Doctor | NexCare</title>
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/nav.css">
    <link rel="stylesheet" href="../shared/portal.css">
</head>
<body>

    <main class="main-content">
        <header class="header">
            <span class="header-title">My Appointments</span>
            <div class="header-user">
                <div class="header-avatar" id="userAvatar">DR</div>
                <div>
                    <p class="header-user-name" id="userNameDisplay">Doctor</p>
                    <p class="header-user-role" id="userRoleDisplay">Doctor</p>
                </div>
            </div>
        </header>

        <div class="page-body">

            <div class="page-header">
                <div>
                    <h1>My appointments</h1>
                    <p>Every slot booked with you. Confirm a request, or mark a consultation complete once the patient has been seen.</p>
                </div>
                <div class="btn-row">
                    <input id="searchBox" placeholder="Search patient or reason…"
                           style="height:38px;border:1px solid #E5E7EB;border-radius:8px;padding:0 12px;font-size:13px;min-width:240px;">
                </div>
            </div>

            <div class="tab-container" id="statusTabs">
                <button class="tab-btn active" data-status="">All</button>
                <button class="tab-btn" data-status="Pending">Pending</button>
                <button class="tab-btn" data-status="Confirmed">Confirmed</button>
                <button class="tab-btn" data-status="Completed">Completed</button>
                <button class="tab-btn" data-status="Cancelled">Cancelled</button>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h2 id="listTitle">All appointments</h2>
                    <span class="hint" id="listCount"></span>
                </div>
                <div class="panel-body flush">
                    <table class="rev">
                        <thead>
                            <tr>
                                <th>Date</th><th>Time</th><th>Patient</th><th>Department</th>
                                <th>Reason</th><th>Status</th><th class="num">Fee</th><th></th>
                            </tr>
                        </thead>
                        <tbody id="apptBody">
                            <tr><td colspan="8" class="empty">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="../shared/api.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/portal.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="appointments.js"></script>
</body>
</html>
