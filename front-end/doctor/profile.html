<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Doctor | NexCare</title>
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/nav.css">
    <link rel="stylesheet" href="../shared/portal.css">
</head>
<body>

    <main class="main-content">
        <header class="header">
            <span class="header-title">My Profile</span>
            <div class="header-user">
                <div class="header-avatar" id="userAvatar">DR</div>
                <div>
                    <p class="header-user-name" id="userNameDisplay">Doctor</p>
                    <p class="header-user-role" id="userRoleDisplay">Doctor</p>
                </div>
            </div>
        </header>

        <div class="page-body">

            <div class="page-header">
                <div>
                    <h1 id="profileName">My profile</h1>
                    <p id="profileSub">Your directory entry — this is what patients see when they book.</p>
                </div>
            </div>

            <div class="panel">
                <div class="panel-head"><h2>Practice details</h2></div>
                <div class="panel-body">
                    <div class="field-grid" id="profileFields">Loading…</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h2>Change password</h2>
                    <span class="hint">At least 6 characters</span>
                </div>
                <div class="panel-body">
                    <div class="field-grid" style="max-width:700px;">
                        <div class="field">
                            <label for="currentPassword">Current password</label>
                            <input id="currentPassword" type="password" autocomplete="current-password">
                        </div>
                        <div class="field">
                            <label for="newPassword">New password</label>
                            <input id="newPassword" type="password" autocomplete="new-password">
                        </div>
                        <div class="field">
                            <label>&nbsp;</label>
                            <button class="btn primary" id="changePasswordBtn">Update password</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="../shared/api.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/portal.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="profile.js"></script>
</body>
</html>
