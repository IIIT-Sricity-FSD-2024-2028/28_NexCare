<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Calendar | Doctor | NexCare</title>
    <link rel="stylesheet" href="../shared/global.css">
    <link rel="stylesheet" href="../shared/nav.css">
    <link rel="stylesheet" href="../shared/portal.css">
</head>
<body>

    <main class="main-content">
        <header class="header">
            <span class="header-title">Leave Calendar</span>
            <div class="header-user">
                <div class="header-avatar" id="userAvatar">DR</div>
                <div>
                    <p class="header-user-name" id="userNameDisplay">Doctor</p>
                    <p class="header-user-role" id="userRoleDisplay">Doctor</p>
                </div>
            </div>
        </header>

        <div class="page-body">

            <div class="page-header">
                <div>
                    <h1>Leave calendar</h1>
                    <p>Request time off. Your hospital manager approves it — an approved leave blocks new bookings for those dates.</p>
                </div>
            </div>

            <div class="panel">
                <div class="panel-head"><h2>Request leave</h2></div>
                <div class="panel-body">
                    <div class="field-grid">
                        <div class="field">
                            <label for="startDate">From</label>
                            <input id="startDate" type="date">
                        </div>
                        <div class="field">
                            <label for="endDate">To</label>
                            <input id="endDate" type="date">
                        </div>
                        <div class="field">
                            <label for="reason">Reason</label>
                            <input id="reason" type="text" placeholder="Conference, personal leave…">
                        </div>
                        <div class="field">
                            <label>&nbsp;</label>
                            <button class="btn primary" id="submitLeaveBtn">Submit request</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h2>My leave requests</h2>
                    <span class="hint" id="leaveCount"></span>
                </div>
                <div class="panel-body flush">
                    <table class="rev">
                        <thead>
                            <tr><th>From</th><th>To</th><th>Reason</th><th>Status</th><th>Approved by</th><th></th></tr>
                        </thead>
                        <tbody id="leaveBody">
                            <tr><td colspan="6" class="empty">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="../shared/api.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/portal.js"></script>
    <script src="../shared/nav.js"></script>
    <script src="leaves.js"></script>
</body>
</html>
