<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Force no-cache so Firefox always loads the latest version -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCare - Leave Management</title>
    <link rel="stylesheet" href="../patient/styles.css">
    <script>
        // JWT-based early auth guard (runs before body renders, prevents flash)
        (function () {
            function decodeJWT(token) {
                try {
                    var parts = token.split('.');
                    if (parts.length !== 3) return null;
                    var raw = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                    var json = decodeURIComponent(atob(raw).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    return JSON.parse(json);
                } catch(e) { return null; }
            }
            var token = sessionStorage.getItem('nexcare_auth_token') || localStorage.getItem('nexcare_auth_token');
            var payload = token ? decodeJWT(token) : null;
            var now = Math.floor(Date.now() / 1000);
            if (!payload || (payload.exp && now > payload.exp) || payload.role !== 'doctor') {
                sessionStorage.clear();
                window.location.replace('../auth/login.html');
            }
            // Sync legacy keys so other inline scripts don't break
            if (payload) {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('nexcare_current_role', payload.role);
            }
        })();
    </script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <a class="sidebar-brand" href="dashboard.html" aria-label="NexCare Doctor Portal Home">
            <nex-care-logo></nex-care-logo>
            <span class="sidebar-brand-subtitle">Doctor Portal</span>
        </a>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect width="8" height="8" x="2" y="2" rx="2" stroke="currentColor" stroke-width="1.5"/>
                    <rect width="8" height="8" x="2" y="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
                    <rect width="8" height="8" x="12" y="2" rx="2" stroke="currentColor" stroke-width="1.5"/>
                    <rect width="8" height="8" x="12" y="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="leaves.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="3" y="4" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M3 8h14" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M7 11h2M11 11h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Leave Management</span>
            </a>
            <a href="appointments/appointments.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M6.667 1.667v3.333M13.333 1.667V5" stroke="currentColor" stroke-width="1.667" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2.917 7.5h14.166" stroke="currentColor" stroke-width="1.667" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="2.5" y="3.333" width="15" height="15" rx="2" stroke="currentColor" stroke-width="1.667"/>
                </svg>
                <span>Appointments</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M17 18c0-3.866-3.134-7-7-7s-7 3.134-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Profile</span>
            </a>
        </nav>

        <button class="logout-btn" onclick="logoutUser()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M12.5 4.167v3.333M2.5 10h10M2.5 10l3.333-3.333M2.5 10l3.333 3.333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12.5 15.833v-3.333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Logout</span>
        </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Leave Management</h1>
                <p class="page-subtitle">View and manage your leave requests</p>
            </div>
            <button class="btn btn-primary" onclick="openLeaveModal()">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                    <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Apply for Leave
            </button>
        </header>

        <!-- Leave Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon pending">
                    <svg width="24" height="24" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10 6v4M10 12h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <p class="stat-label">Pending</p>
                    <p class="stat-value" id="pendingCount">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon approved">
                    <svg width="24" height="24" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M6 10l3 3 5-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <p class="stat-label">Approved</p>
                    <p class="stat-value" id="approvedCount">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon rejected">
                    <svg width="24" height="24" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M7 7l6 6M13 7l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <p class="stat-label">Rejected</p>
                    <p class="stat-value" id="rejectedCount">0</p>
                </div>
            </div>
        </div>

        <!-- Leave Requests Table -->
        <div class="card">
            <div class="card-header">
                <h2>My Leave Requests</h2>
                <div class="filter-group">
                    <select id="statusFilter" class="filter-select" onchange="filterLeaves()">
                        <option value="all">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Leave ID</th>
                            <th>Date Range</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Applied On</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leavesTableBody">
                        <!-- Leave requests will be populated here -->
                    </tbody>
                </table>
                <div id="noLeavesMessage" class="no-data-message" style="display: none;">
                    <svg width="48" height="48" viewBox="0 0 20 20" fill="none">
                        <rect x="3" y="4" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M3 8h14" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <p>No leave requests found</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Apply Leave Modal -->
    <div id="leaveModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Apply for Leave</h2>
                <button class="modal-close" onclick="closeLeaveModal()">&times;</button>
            </div>
            <form id="leaveForm" onsubmit="submitLeaveRequest(event)">
                <div class="form-group">
                    <label for="startDate">Start Date *</label>
                    <input type="date" id="startDate" name="startDate" required>
                </div>
                <div class="form-group">
                    <label for="endDate">End Date *</label>
                    <input type="date" id="endDate" name="endDate" required>
                </div>
                <div class="form-group">
                    <label for="reason">Reason *</label>
                    <textarea id="reason" name="reason" rows="4" required placeholder="Please provide a reason for your leave request"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeLeaveModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit Request</button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Leave Details Modal -->
    <div id="viewLeaveModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Leave Details</h2>
                <button class="modal-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div id="leaveDetailsContent">
                <!-- Leave details will be populated here -->
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeViewModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/nav.js"></script>
    <script src="../shared/session.js"></script>
    <script src="../shared/api.js"></script>
    <script src="leaves.js"></script>
</body>
</html>
